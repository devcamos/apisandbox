name: Vercel Deployment E2E

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel deployment URL to test
        required: true
        type: string
      git_sha:
        description: Optional commit SHA to check out
        required: false
        type: string
      environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-e2e-${{ github.event.client_payload.project.id || 'manual' }}-${{ github.event.client_payload.environment || inputs.environment || 'manual' }}-${{ github.event.client_payload.git.sha || inputs.git_sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: API Sandbox deployed E2E
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.client_payload.url || inputs.base_url }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha || inputs.git_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed database and authentication
        run: node scripts/vercel-deployment-e2e.mjs

      # Durable Preview schema path: when PREVIEW_DATABASE_URL is configured, apply
      # pending migrations to the isolated Preview DB before registration E2E.
      # Production deployments never enter this step. Secrets must be the Supabase
      # Preview project only — never Neon Production. See docs/DEPLOYMENT.md.
      # repository_dispatch loads this workflow from main; the checkout is the
      # deployment SHA (may predate migrate-on-preview.mjs), so fall back to main's helper.
      - name: Apply pending Preview migrations (isolated Preview DB only)
        if: env.DEPLOYMENT_ENVIRONMENT == 'preview'
        env:
          CONFIRM_PREVIEW_MIGRATE: "YES"
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          VERCEL_ENV: preview
          ENVIRONMENT: preview
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::PREVIEW_DATABASE_URL is unset — skipping Preview migrate. If register returns 503 configuration_error, run workflow Preview DB migrate (or npm run db:migrate:preview) against the isolated Preview DB only."
            exit 0
          fi
          if [ ! -f scripts/migrate-on-preview.mjs ]; then
            echo "Loading scripts/migrate-on-preview.mjs from origin/main for this deployment SHA"
            git fetch origin main --depth=1
            git checkout origin/main -- scripts/migrate-on-preview.mjs
          fi
          node scripts/migrate-on-preview.mjs

      - name: Install Playwright Chromium
        if: env.DEPLOYMENT_ENVIRONMENT != 'production'
        run: npx playwright install chromium --with-deps

      - name: Run deployed registration and login E2E
        if: env.DEPLOYMENT_ENVIRONMENT != 'production'
        env:
          PLAYWRIGHT_PROD_URL: ${{ env.BASE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: npm run test:prod

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vercel-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Report deployment check to Vercel
        if: always() && github.event_name == 'repository_dispatch'
        # Pin past v1 (node20) to the node24 runtime upgrade on main.
        # repository_dispatch always loads this workflow from the default branch,
        # so this pin (and the checkout/setup-node majors above) take effect for
        # Vercel E2E only after this file is on main.
        uses: vercel/repository-dispatch/actions/status@61881006269f0b5ac2cb186b198c54be6afe90e1 # node24
        with:
          name: Vercel - API Sandbox E2E (${{ github.event.client_payload.environment || inputs.environment || 'manual' }})
