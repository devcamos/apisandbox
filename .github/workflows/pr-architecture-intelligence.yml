name: PR Architecture Intelligence

on:
  pull_request:
    # `synchronize` reruns the review whenever new commits are pushed to an open PR.
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-architecture-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: devonte-amos-apps/pr-intelligence/.github/workflows/pr-architecture-intelligence.yml@v1.1.0-rc2
    with:
      tool-ref: v1.1.0-rc2
      rules-path: architecture-rules.json
      node-version: "22"
      dependency-cruiser-dirs: app components config lib
      extra-env: |
        AUTH_SECRET=github-actions-ci-placeholder-secret-min-32-chars
        NEXTAUTH_SECRET=github-actions-ci-placeholder-secret-min-32-chars
        DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/_build_placeholder
        DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5432/_build_placeholder
        NEXT_PUBLIC_APP_URL=http://localhost:4000
        RESEND_API_KEY=github-actions-ci-resend-placeholder
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
